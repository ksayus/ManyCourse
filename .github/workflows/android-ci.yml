name: Android CI/CD

# ─────────────────────────────────────────────────────────────────────────────
#  三个 Job：
#    build   推分支 / PR      → 跑全部单测 + 出 debug 与未签名 release 包（artifact）
#    release 推 v* 标签       → Secrets 签名出正式包 → 自动发 GitHub Release（附 APK）
#    pages   推默认分支       → 部署 index.html 到 GitHub Pages（在线下载页）
#
#  设计上的几条硬要求：
#    - 没有签名 Secrets 也能跑：跳过签名，产出未签名包，绝不因为缺密钥而失败；
#    - 密钥只作为临时文件存在，构建完（无论成败）立刻删除；
#    - 每次构建的 versionCode 唯一（用 run number），避免"已安装更高版本"装不上；
#    - 缓存 ~/.gradle，命中时构建从数分钟降到一分钟级。
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的标签（留空 = 当前分支，不发布 Release）'
        required: false
        type: string

# 同一分支的重复推送取消上一次未完成的运行；标签发布不取消（发布不能半途而废）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Gradle 自身的行为：控制台更干净、内存更稳
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8'
  GRADLE_ARGS: '--no-daemon --stacktrace --console=plain'

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # 1) 持续集成：测试 + 出包
  # ══════════════════════════════════════════════════════════════════════════
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9.x 需要 JDK 17+；这里固定 21（本项目在 21 / 25 上都验证过）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Android SDK：GitHub 的 ubuntu runner **自带**（`/usr/local/lib/android/sdk`，
      # 而且已经设好 ANDROID_HOME / ANDROID_SDK_ROOT），所以不需要第三方 action 再装一遍 ——
      # 而且 `android-actions/setup-android@v3` 内部会执行 `sdkmanager tools`，
      # 那个**遗留包已经被 Google 从仓库索引里删掉**了（`Failed to find package 'tools'`），
      # 会让整个 job 卡死在这一步（2026-09 起必现）。改成自己装需要的那几个包。
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # Gradle 靠这个环境变量找 SDK（CI 上没有 local.properties —— 它是 gitignore 的）
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          # sdkmanager 不一定在 PATH 上（镜像里在 cmdline-tools/<版本>/bin），按绝对路径找
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          if [ -z "$SDKMANAGER" ]; then echo "❌ 找不到 sdkmanager（runner 镜像变了吗？）"; exit 1; fi
          echo "sdkmanager: $SDKMANAGER"
          # 先把 license 全接受掉；`yes` 被提前关掉管道会喊 "Broken pipe"，整段丢 stderr 图个清静
          { yes | "$SDKMANAGER" --licenses > /dev/null; } 2>/dev/null || true

          # ── 平台包名**不是** `platforms;android-37` ────────────────────────────────
          # Google 从 API 36 起改成按"次版本"发布平台，包名里带次版本号：API 37（Android 17）
          # 在仓库索引里叫 **platforms;android-37.0** —— 装完就是 `platforms/android-37.0/`，
          # 那个目录的 source.properties 里写着 `AndroidVersion.ApiLevel=37.0`。
          # 写成 android-37 会得到：
          #   Warning: Failed to find package 'platforms;android-37'
          # 然后 sdkmanager 以 1 退出、整个 job 挂在这一步（2026-09 起必现）。
          # 所以这里不写死名字：直接从仓库索引里挑出真实存在的最新 android-37.x，
          # 以后 Google 再改命名/再发 37.1 都不用动这个文件。
          PLATFORM=$("$SDKMANAGER" --list 2>/dev/null | tr -d '\r' | awk '{print $1}' \
            | grep -E '^platforms;android-37(\.[0-9]+)?$' | sort -V | tail -n1 || true)
          if [ -z "$PLATFORM" ]; then
            # 兜底：万一 --list 的输出格式变了导致没抓到，退回最可能的名字硬试一次，
            # 顺便把索引里真实存在的平台打出来，下次一眼能看出该改哪个名字
            echo "⚠️  索引里没匹配到 android-37.x，退回硬编的 platforms;android-37.0 试一次"
            echo "    索引里现有的平台："
            "$SDKMANAGER" --list 2>/dev/null | tr -d '\r' | awk '{print $1}' \
              | grep -E '^platforms;' | sort -u || true
            PLATFORM='platforms;android-37.0'
          fi
          echo "要装的平台：$PLATFORM"
          # build-tools 固定 36.0.0：AGP 9.3 + compileSdk 37 用它能出包
          # （本地 SDK 里只装了 platforms/android-37.0 + build-tools/36.0.0，debug/release 都出得来）
          "$SDKMANAGER" --install 'platform-tools' "$PLATFORM" 'build-tools;36.0.0'

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 单测（JVM）：解析器 / 加密 / 选校区 / 节次表 / 会话存档 ──────────────
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest $GRADLE_ARGS

      # ── 出包：debug（可直接安装）+ release（无密钥时为未签名包） ─────────────
      - name: Assemble APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease $GRADLE_ARGS -PversionCode=${{ github.run_number }}

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          # 名字带上版本与提交号，下载下来一眼知道是哪个包
          stamp="${{ github.run_number }}-${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/ManyCourse-debug-${stamp}.apk"
          # release 目录里可能是 app-release.apk（已签名）或 app-release-unsigned.apk
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' \
            -exec cp {} "artifacts/ManyCourse-release-${stamp}.apk" \;
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      # 测试报告失败也要看得到，所以用 always()
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  # 2) 持续交付：签名 + 发 Release
  # ══════════════════════════════════════════════════════════════════════════
  release:
    name: Sign & Release APK
    # 只对 v* 标签（或手动指定标签）发版；普通 push 不惊动它
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # 创建 Release 需要
    # 下面两个用来发 Gitee 版（**可选**，没配就跳过那一步）：
    #   Variables → GITEE_REPO = owner/repo
    #   Secrets   → GITEE_TOKEN = Gitee 私人令牌（勾 projects 权限）
    # 放在 job 级 env 上是为了能在 step 的 if 里判断 —— GitHub 的 if 条件**读不到 secrets**。
    env:
      GITEE_REPO: ${{ vars.GITEE_REPO }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)
          if [ -z "$SDKMANAGER" ]; then echo "❌ 找不到 sdkmanager（runner 镜像变了吗？）"; exit 1; fi
          echo "sdkmanager: $SDKMANAGER"
          # license 全接受（`yes` 的 Broken pipe 噪音丢掉）；平台包名的坑见 build job 里的长注释：
          # API 37 在仓库里叫 platforms;android-37.0，写 android-37 会 Failed to find package
          { yes | "$SDKMANAGER" --licenses > /dev/null; } 2>/dev/null || true
          PLATFORM=$("$SDKMANAGER" --list 2>/dev/null | tr -d '\r' | awk '{print $1}' \
            | grep -E '^platforms;android-37(\.[0-9]+)?$' | sort -V | tail -n1 || true)
          if [ -z "$PLATFORM" ]; then
            echo "⚠️  索引里没匹配到 android-37.x，退回硬编的 platforms;android-37.0 试一次"
            "$SDKMANAGER" --list 2>/dev/null | tr -d '\r' | awk '{print $1}' \
              | grep -E '^platforms;' | sort -u || true
            PLATFORM='platforms;android-37.0'
          fi
          echo "要装的平台：$PLATFORM"
          "$SDKMANAGER" --install 'platform-tools' "$PLATFORM" 'build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 签名准备：把 Base64 密钥还原成文件 + 生成 Gradle 属性 ────────────────
      # 没配 Secrets 时这一步直接跳过 → 后面产出未签名包，不会让整个流程失败
      - name: Prepare signing key
        id: signing
        env:
          KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_STORE_BASE64" ]; then
            echo "⚠️  未配置 SIGNING_KEY_STORE_BASE64，跳过签名（只出未签名包）"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEY_STORE_BASE64" | base64 --decode > release.p12
          # 密钥信息写进 GRADLE_USER_HOME 下的 gradle.properties ——
          # Gradle 会自动加载这个文件，签名配置直接就能读到（不用改命令行参数）
          mkdir -p "$HOME/.gradle"
          {
            echo "manycourse.storeFile=$GITHUB_WORKSPACE/release.p12"
            echo "manycourse.storePassword=$STORE_PASSWORD"
            echo "manycourse.keyAlias=$KEY_ALIAS"
            echo "manycourse.keyPassword=$KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "✅ 签名密钥已就绪"

      - name: Resolve version
        id: version
        run: |
          # tag v1.2.3 → versionName 1.2.3；手动触发没给 tag 就用 run number 兜底。
          # 兼容**没有 v 前缀**的历史 tag（本仓库第一个版本就是 1.0.0.3）——
          # 否则手动重发那一次会得到 versionName=0.0.<run>，APK 名字和 App 里显示的版本全错。
          ref="${{ inputs.tag || github.ref_name }}"
          if [[ "$ref" =~ ^v?[0-9]+(\.[0-9]+)+$ ]]; then
            version="${ref#v}"
          else
            version="0.0.${{ github.run_number }}"
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "versionName=$version"

      # 签名信息通过 ~/.gradle/gradle.properties 传给构建（app/build.gradle.kts 里从
      # `manycourse.*` 这几个 Gradle 属性读）；没配 Secrets 时这个文件不存在，
      # 构建照样成功，只是产出 app-release-unsigned.apk。
      - name: Build release APK
        run: ./gradlew :app:assembleRelease $GRADLE_ARGS \
          -PversionName='${{ steps.version.outputs.name }}' \
          -PversionCode=${{ github.run_number }}

      - name: Verify the APK
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1 || true)
          if [ -z "$apk" ]; then
            echo "❌ 没有产出 release APK"; ls -R app/build/outputs/apk; exit 1
          fi
          echo "APK: $apk"
          ls -lh "$apk"
          # 顺手把 SHA-256 写出来，附到 Release 说明里方便用户核对
          sha256sum "$apk" | tee apk.sha256
          # 已签名的包能被 apksigner 读出签名证书；未签名包这里会返回非 0（不算错误）
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" \
            || echo "⚠️  未签名包（没有配置签名 Secrets）"

      - name: Rename APK for release
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1)
          cp "$apk" "ManyCourse-${{ steps.version.outputs.name }}.apk"
          ls -lh ManyCourse-*.apk

      # 无论成败都要删掉临时密钥（密钥文件是明文落盘的，不能留在 runner 上）
      - name: Clean up signing key
        if: always()
        run: |
          rm -f release.p12
          rm -f "$HOME/.gradle/gradle.properties"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ManyCourse ${{ steps.version.outputs.name }}
          generate_release_notes: true
          append_body: true
          body: |
            ### 下载

            | 文件 | 说明 |
            |---|---|
            | `ManyCourse-${{ steps.version.outputs.name }}.apk` | 正式包（R8 优化，需 Android 12+） |

            **安装**：手机浏览器打开本页下载 → 允许"安装未知来源应用" → 安装。
            已装过旧版本的可以直接覆盖安装（同签名）。

            **校验**：`apk.sha256` 文件里是本次 APK 的 SHA-256；Windows 上执行
            `Get-FileHash ManyCourse-${{ steps.version.outputs.name }}.apk -Algorithm SHA256` 对比即可。
          files: |
            ManyCourse-${{ steps.version.outputs.name }}.apk
            apk.sha256
          fail_on_unmatched_files: true

      # ── Gitee 版（可选）────────────────────────────────────────────────
      # 为什么必须单独做一遍：**GitHub Release 与 Gitee Release 是两套独立的东西**，
      # 往 GitHub 推 tag 不会自动出现在 Gitee。而应用的自动更新两个源都查，
      # 所以两边都得有同一份 `ManyCourse-<版本>.apk`。
      #
      # 没配 `vars.GITEE_REPO` / `secrets.GITEE_TOKEN` 时这两步**直接跳过**，
      # 不会让发布失败（只发 GitHub 也能用，App 侧只会用到 GitHub 源）。
      - name: Ensure Gitee has this tag
        if: env.GITEE_REPO != '' && env.GITEE_TOKEN != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/${GITEE_REPO}"
          # Gitee 建 Release 要求 tag 存在；而 CI 只在 GitHub 上跑，不会自动把 tag 推过去 ——
          # 不补这一步的话，发版时 Gitee 那半会静默失败（下一次才知道更新没发出去）
          has_tag=$(curl -sS "${api}/tags?per_page=100" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('1' if any(t.get('name')=='${TAG}' for t in d) else '0')" || echo 0)
          if [ "${has_tag}" = "1" ]; then
            echo "Gitee 上已有 tag ${TAG}"
            exit 0
          fi
          echo "Gitee 上没有 tag ${TAG}，推过去…"
          # 令牌只出现在这一步的 remote URL 里；runner 是一次性的，跑完就没了
          # （GitHub 会自动把日志里的 secret 值打码，所以不会漏到日志里）
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push gitee "refs/tags/${TAG}"

      - name: Publish Gitee Release
        if: env.GITEE_REPO != '' && env.GITEE_TOKEN != ''
        env:
          VERSION: ${{ steps.version.outputs.name }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          api="https://gitee.com/api/v5/repos/${GITEE_REPO}"
          auth=(-H "Authorization: Bearer ${GITEE_TOKEN}")

          # 1) 已经有同 tag 的 Release 就复用（重复触发同一次发布时不至于报错）
          release_id=$(curl -sS "${auth[@]}" "${api}/releases?per_page=100" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((r['id'] for r in d if r.get('tag_name')=='${TAG}'),''))" || true)

          # 2) 没有就建一个（**不带 target_commitish**：上一步已经确保 tag 在 Gitee 上了，
          #    再传一个 commit-ish 反而多一个可能被拒的参数）
          if [ -z "${release_id}" ]; then
            release_id=$(curl -sS -X POST "${auth[@]}" \
              -H "Content-Type: application/json" \
              -d "{\"access_token\":\"${GITEE_TOKEN}\",\"tag_name\":\"${TAG}\",\"name\":\"ManyCourse ${VERSION}\",\"body\":\"与 GitHub Release ${TAG} 同一份产物。\"}" \
              "${api}/releases" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
          fi
          if [ -z "${release_id}" ]; then
            echo "❌ 建 Gitee Release 失败（检查 GITEE_TOKEN 的 projects 权限、以及 GITEE_REPO 是否存在）"
            exit 1
          fi

          # 3) 传附件（multipart，字段名固定是 file）
          for file in "ManyCourse-${VERSION}.apk" apk.sha256; do
            echo "上传 ${file} …"
            curl -sS -X POST "${auth[@]}" \
              -F "file=@${file}" \
              "${api}/releases/${release_id}/attach_files" > /dev/null
          done
          echo "✅ Gitee Release ${TAG} 已发布：https://gitee.com/${GITEE_REPO}/releases/tag/${TAG}"

  # ══════════════════════════════════════════════════════════════════════════
  # 3) 持续部署：下载页上 Pages
  # ══════════════════════════════════════════════════════════════════════════
  pages:
    name: Deploy Download Page
    # 只在默认分支的推送、或手动触发时部署
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 不取消进行中的部署：Pages 部署被中断会留下半成品
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 为什么要有这一步：Pages 站点必须先由**人**打开一次 ────────────────────
      # 仓库没开 Pages 时，`configure-pages` 只会甩一句
      #   "Get Pages site failed ... Error: Not Found"（找不到"该由你创建的东西"）
      # 它自带的 `enablement: true` 也救不了：**创建 Pages 站点是仓库管理级操作，
      # GITHUB_TOKEN 永远没有这个权限**（写什么 `permissions:` 都没用，这是故意的安全边界），
      # 加了只会换成另一句更费解的 "Resource not accessible by integration"。
      # 一次性的人工操作（只需点一下，之后每次推送都自动部署）：
      #   Settings → Pages → Build and deployment → Source 选「GitHub Actions」
      # 这一步提前把话说清楚，省得你对着 Not Found 查半天工作流。
      - name: Check Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # curl 自己失败（断网等）不算错误，交给下面的最后一条分支处理
          resp=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -w '\n%{http_code}' \
            "https://api.github.com/repos/${{ github.repository }}/pages" || true)
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          case "$code" in
            200)
              build_type=$(printf '%s' "$body" \
                | python3 -c "import sys,json;print(json.load(sys.stdin).get('build_type',''))" 2>/dev/null || true)
              if [ "$build_type" != "workflow" ]; then
                echo "❌ Pages 站点存在，但 Source 不是「GitHub Actions」（当前 build_type='$build_type'）。"
                echo "   打开 https://github.com/${{ github.repository }}/settings/pages"
                echo "   → Build and deployment → Source 改成「GitHub Actions」→ 回来重跑本 job。"
                exit 1
              fi
              echo "✅ Pages 站点已就绪（build_type=workflow）"
              ;;
            404)
              echo "❌ 仓库还没有 Pages 站点，所以 configure-pages 报 'Not Found'。"
              echo "   打开 https://github.com/${{ github.repository }}/settings/pages"
              echo "   → Build and deployment → Source 选「GitHub Actions」→ 回来重跑本 job。"
              echo "   （只需点这一次。这一步 GITHUB_TOKEN 代替不了：创建 Pages 站点是仓库管理级操作。）"
              exit 1
              ;;
            *)
              echo "⚠️  查询 Pages 状态返回 HTTP '${code:-无响应}'，判断不了，继续交给 configure-pages"
              ;;
          esac

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 只发布静态页，别把任何构建目录带走（仓库根作为站点根，index.html 直接可访问）
      - name: Prune build outputs
        run: rm -rf app/build build .gradle .kotlin

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # 整仓库根目录：index.html 在根上（根目录没有下划线开头的文件，
          # 不会踩 Jekyll 的忽略规则；真加了再补 .nojekyll）
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
