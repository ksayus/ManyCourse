# ─────────────────────────────────────────────────────────────────────────────
#  使用前必读：
#  1. 手动启用 GitHub Pages：仓库 Settings → Pages → Source 选择 "GitHub Actions"
#  2. 确认 app/build.gradle.kts 中 compileSdk = 37
# ─────────────────────────────────────────────────────────────────────────────

name: Android CI/CD

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的标签（留空 = 当前分支，不发布 Release）'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8'
  GRADLE_ARGS: '--no-daemon --stacktrace --console=plain'

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # 1) 持续集成：测试 + 出包
  # ══════════════════════════════════════════════════════════════════════════
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # 关键修正：android-37 的正确包名是 android-37.0
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest $GRADLE_ARGS

      - name: Assemble APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease $GRADLE_ARGS -PversionCode=${{ github.run_number }}

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          stamp="${{ github.run_number }}-${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/ManyCourse-debug-${stamp}.apk"
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' \
            -exec cp {} "artifacts/ManyCourse-release-${stamp}.apk" \;
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  # 2) 持续交付：签名 + 发 Release
  # ══════════════════════════════════════════════════════════════════════════
  release:
    name: Sign & Release APK
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # 同样使用正确的包名 android-37.0
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing key
        id: signing
        env:
          KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY_STORE_BASE64" ]; then
            echo "⚠️  未配置 SIGNING_KEY_STORE_BASE64，跳过签名"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEY_STORE_BASE64" | base64 --decode > release.p12
          mkdir -p "$HOME/.gradle"
          {
            echo "manycourse.storeFile=$GITHUB_WORKSPACE/release.p12"
            echo "manycourse.storePassword=$STORE_PASSWORD"
            echo "manycourse.keyAlias=$KEY_ALIAS"
            echo "manycourse.keyPassword=$KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "✅ 签名密钥已就绪"

      - name: Resolve version
        id: version
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          case "$ref" in
            v*) version="${ref#v}" ;;
            *)  version="0.0.${{ github.run_number }}" ;;
          esac
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "versionName=$version"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease $GRADLE_ARGS \
          -PversionName='${{ steps.version.outputs.name }}' \
          -PversionCode=${{ github.run_number }}

      - name: Verify the APK
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1 || true)
          if [ -z "$apk" ]; then
            echo "❌ 没有产出 release APK"; ls -R app/build/outputs/apk; exit 1
          fi
          echo "APK: $apk"
          ls -lh "$apk"
          sha256sum "$apk" | tee apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" \
            || echo "⚠️  未签名包"

      - name: Rename APK for release
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1)
          cp "$apk" "ManyCourse-${{ steps.version.outputs.name }}.apk"
          ls -lh ManyCourse-*.apk

      - name: Clean up signing key
        if: always()
        run: |
          rm -f release.p12
          rm -f "$HOME/.gradle/gradle.properties"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ManyCourse ${{ steps.version.outputs.name }}
          generate_release_notes: true
          append_body: true
          body: |
            ### 下载

            | 文件 | 说明 |
            |---|---|
            | `ManyCourse-${{ steps.version.outputs.name }}.apk` | 正式包（R8 优化） |

            **校验**：`apk.sha256` 文件里是本次 APK 的 SHA-256。
          files: |
            ManyCourse-${{ steps.version.outputs.name }}.apk
            apk.sha256
          fail_on_unmatched_files: true

  # ══════════════════════════════════════════════════════════════════════════
  # 3) 持续部署：下载页上 Pages
  # ══════════════════════════════════════════════════════════════════════════
  pages:
    name: Deploy Download Page
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 已手动启用 Pages，无需 enablement / token
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prune build outputs
        run: rm -rf app/build build .gradle .kotlin

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
